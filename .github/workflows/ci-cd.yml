name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Smoke test executable JAR
        run: java -jar target/study-session-stats.jar examples/sessions.json
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: study-session-stats-${{ matrix.os }}
          path: target/study-session-stats.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 30

  deploy:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested JAR
        uses: actions/download-artifact@v5
        with:
          name: study-session-stats-ubuntu-latest
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.jar --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.jar \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
